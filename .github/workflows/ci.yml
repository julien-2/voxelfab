name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    name: Golden structure test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"   # doit correspondre à l'environnement du golden
          enable-cache: true

      - name: Install package
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Golden structure test (determinism anchor)
        run: uv run pytest tests/test_golden.py -v

      - name: Smoke test (engine bench, 2 M voxels)
        run: uv run vf bench 128
